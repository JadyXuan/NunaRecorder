name: Build signed Android test artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "signed-test/**"

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.release-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify release signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs
          app/build/outputs/apk/release/app-release.apk

      - name: Prepare private test artifact
        run: |
          short_sha="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/release/app-release.apk "NunaRecorder-test-${short_sha}.apk"
          sha256sum "NunaRecorder-test-${short_sha}.apk" > "NunaRecorder-test-${short_sha}.apk.sha256"

      - name: Upload private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: NunaRecorder-signed-test-${{ github.sha }}
          path: |
            NunaRecorder-test-*.apk
            NunaRecorder-test-*.apk.sha256
          if-no-files-found: error
          retention-days: 3
