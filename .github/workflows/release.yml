name: Publish signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nunarecorder-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Test and build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs
          app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "NunaRecorder-${GITHUB_REF_NAME}.apk"
          sha256sum "NunaRecorder-${GITHUB_REF_NAME}.apk" > "NunaRecorder-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NunaRecorder ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            NunaRecorder-${{ github.ref_name }}.apk
            NunaRecorder-${{ github.ref_name }}.apk.sha256
